 display: block; border-radius: 8px;"><img src="a6.jpg" style="width: 100%; display: block; border-radius: 8px;"></div></div></div>
  <div style="position: absolute; inset: 0; background: rgba(22,22,24,0.72);"></div>
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
    <div data-probe="modal" style="width: 440px; background: #282830; border: 1px solid #414853; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 18px; box-shadow: 0 24px 60px rgba(0,0,0,0.5);">

      <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px;">

      </div>
      <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 4px; cursor: pointer;">
        <span style="width: 20px; height: 20px; border-radius: 4px; border: 1px solid #414853; background: #1B1B1F; flex: none;"></span>
        <span style="font-size: 12.5px; color: #71717A;">Remember for 30 days</span>

    </div>

</div></body></html>
